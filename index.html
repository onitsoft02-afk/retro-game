<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레트로 갤러그 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            border: 2px solid #333;
        }

        canvas {
            background-color: #050510;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px #000;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }

        h1 {
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 10px;
        }

        button {
            background-color: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 10px #00ffff;
            transition: 0.2s;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        <div id="ui-layer">
            <div>점수: <span id="scoreVal">0</span></div>
            <div>레벨: <span id="levelVal">1</span></div>
            <div>생명: <span id="livesVal">3</span></div>
            <div>레이저(Z): <span id="laserVal" style="color:#00ffcc">준비됨</span></div>
        </div>
        <div id="game-over-screen">
            <h1 id="game-over-title">게임 오버</h1>
            <p>최종 점수: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">다시 시작</button>
        </div>
    </div>

    <script>
        // 캔버스 및 컨텍스트 초기화
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 요소 가져오기
        const scoreValEl = document.getElementById('scoreVal');
        const levelValEl = document.getElementById('levelVal');
        const livesValEl = document.getElementById('livesVal');
        const laserValEl = document.getElementById('laserVal');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverTitle = document.getElementById('game-over-title');
        const finalScoreEl = document.getElementById('finalScore');

        // 사운드 시스템 (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // 특정 주파수와 파형으로 소리를 재생하는 함수
        function playTone(freq, type, duration, vol=0.1) {
            // 브라우저 정책에 의해 오디오가 중지되어 있으면 재개
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator(); // 소리 발생기
            const gain = audioCtx.createGain();      // 볼륨 조절기
            
            osc.type = type; // 파형 (square, sawtooth, sine 등)
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime); // 주파수 설정
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // 재생 시간에 따른 볼륨 페이드아웃 효과
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // 효과음 재생 함수 모음
        const sfx = {
            shoot: () => playTone(800, 'square', 0.1, 0.05), // 미사일 발사음
            laser: () => playTone(300, 'sawtooth', 0.5, 0.1), // 레이저 발사음
            explosion: () => playTone(100, 'sawtooth', 0.2, 0.1), // 폭발음
            levelUp: () => { // 레벨 업 (빠른 상승음)
                playTone(400, 'sine', 0.1, 0.1);
                setTimeout(() => playTone(600, 'sine', 0.2, 0.1), 100);
                setTimeout(() => playTone(800, 'sine', 0.3, 0.1), 200);
            },
            gameOver: () => { // 게임 오버 (하강음)
                playTone(300, 'square', 0.3, 0.1);
                setTimeout(() => playTone(250, 'square', 0.3, 0.1), 300);
                setTimeout(() => playTone(200, 'square', 0.5, 0.1), 600);
            }
        };

        // 게임 상태 변수
        let score = 0;      // 현재 점수
        let level = 1;      // 현재 레벨
        let lives = 3;      // 남은 생명 수
        let isGameOver = false; // 게임 종료 여부
        let gameWon = false;    // 승리 여부
        let keys = {};      // 현재 눌려진 키 상태 저장 객체
        let lastShotTime = 0; // 마지막으로 미사일을 발사한 시간
        const shotDelay = 200; // 미사일 발사 쿨다운 (밀리초)
        
        // 레이저 스킬 상태 변수
        let laserActive = false; // 레이저 발사 중인지 여부
        let laserTimer = 0;      // 레이저 지속 시간 만료 시점
        let laserCooldownTimer = 0; // 레이저 쿨다운 만료 시점
        const LASER_DURATION = 300;  // 레이저 지속 시간 (밀리초)
        const LASER_COOLDOWN = 0; // 레이저 쿨다운 시간 (밀리초) (쿨다운 없음)

        // 플레이어(우주선) 객체
        const player = {
            x: canvas.width / 2 - 15, // 화면 중앙 배치
            y: canvas.height - 50,
            width: 30,
            height: 20,
            speed: 5, // 이동 속도
            color: '#00ffcc'
        };

        // 미사일 정보를 담는 배열
        let bullets = [];
        const bulletSpeed = 7; // 미사일 이동 속도

        // 적(외계인) 배열
        let enemies = [];
        let enemySpeed = 1; // 적 좌우 이동 속도
        let enemyDirection = 1; // 1 = 오른쪽 이동, -1 = 왼쪽 이동

        // 별(배경) 배열 초기화
        let stars = [];
        for(let i = 0; i < 100; i++){
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2, // 별의 크기
                speed: Math.random() * 3 + 1 // 별이 떨어지는 속도
            });
        }

        // 새로운 적 배열(레벨)을 생성하는 함수
        function createEnemies() {
            enemies = [];
            
            if (level % 10 === 0) {
                // 보스 스테이지
                const bossType = (level / 10) % 3; // 1, 2, 0 형태 순환
                const hp = level * 50; // 체력: 10렙 500, 20렙 1000...
                
                enemies.push({
                    x: canvas.width / 2 - 50,
                    y: 50,
                    width: 100,
                    height: 80,
                    type: 'boss',
                    bossType: bossType,
                    hp: hp,
                    maxHp: hp
                });
            } else {
                // 일반 적 대형 다양화
                const formationType = level % 5;
                
                if (formationType === 1) {
                    // V자 대형
                    for (let row = 0; row < 4; row++) {
                        for (let col = row; col < 8 - row; col++) {
                            enemies.push({
                                x: 50 + col * 45,
                                y: 50 + row * 40,
                                width: 25,
                                height: 20,
                                type: row % 3
                            });
                        }
                    }
                } else if (formationType === 2) {
                    // 체크무늬 대형
                    for (let row = 0; row < 4; row++) {
                        for (let col = 0; col < 8; col++) {
                            if ((row + col) % 2 === 0) {
                                enemies.push({
                                    x: 50 + col * 45,
                                    y: 50 + row * 40,
                                    width: 25,
                                    height: 20,
                                    type: row % 3
                                });
                            }
                        }
                    }
                } else if (formationType === 3) {
                    // 다이아몬드 대형
                    for (let row = 0; row < 5; row++) {
                        for (let col = 0; col < 7; col++) {
                            let dist = Math.abs(2 - row) + Math.abs(3 - col);
                            if (dist <= 2) {
                                enemies.push({
                                    x: 60 + col * 50,
                                    y: 50 + row * 40,
                                    width: 25,
                                    height: 20,
                                    type: row % 3
                                });
                            }
                        }
                    }
                } else if (formationType === 4) {
                    // 양쪽 분할 대형
                    for (let row = 0; row < 4; row++) {
                        for (let col = 0; col < 8; col++) {
                            if (col < 3 || col > 4) {
                                enemies.push({
                                    x: 50 + col * 45,
                                    y: 50 + row * 40,
                                    width: 25,
                                    height: 20,
                                    type: row % 3
                                });
                            }
                        }
                    }
                } else {
                    // 기본 4x8 대형
                    for (let row = 0; row < 4; row++) {
                        for (let col = 0; col < 8; col++) {
                            enemies.push({
                                x: 50 + col * 45,
                                y: 50 + row * 40,
                                width: 25,
                                height: 20,
                                type: row % 3 // 줄에 따라 다른 색상 지정 용도
                            });
                        }
                    }
                }
            }
        }

        // 키를 눌렀을 때 이벤트 처리
        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
        });

        // 키에서 손을 뗐을 때 이벤트 처리
        window.addEventListener('keyup', function(e) {
            keys[e.code] = false;
        });

        // 우주 배경(별) 업데이트 및 그리기 함수
        function drawStars() {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                star.y += star.speed; // 별이 아래로 떨어짐
                // 화면 아래로 벗어나면 화면 위 랜덤 위치에서 다시 시작
                if(star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 플레이어 우주선을 그리는 함수
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.beginPath();
            // 삼각형 모양 우주선 그리기
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x + player.width/2 + 5, player.y + player.height - 5);
            ctx.lineTo(player.x + player.width/2 - 5, player.y + player.height - 5);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();
        }

        // 벌레 형태의 적 또는 보스 그리는 함수
        function drawEnemies() {
            enemies.forEach(enemy => {
                const cx = enemy.x + enemy.width / 2;
                const cy = enemy.y + enemy.height / 2;
                const w = enemy.width;
                const h = enemy.height;

                if (enemy.type === 'boss') {
                    // 보스 그리기
                    ctx.fillStyle = '#ff3333';
                    if (enemy.bossType === 1) ctx.fillStyle = '#ff9900';
                    if (enemy.bossType === 2) ctx.fillStyle = '#cc00ff';
                    
                    // 거대 보스 형태 (단순한 거대 벌레 모양)
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 보스 더듬이
                    ctx.strokeStyle = ctx.fillStyle;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(cx - w/4, cy - h/2);
                    ctx.lineTo(cx - w/2, cy - h);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx + w/4, cy - h/2);
                    ctx.lineTo(cx + w/2, cy - h);
                    ctx.stroke();

                    // 보스 눈
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - w/4, cy - h/4, 10, 0, Math.PI * 2);
                    ctx.arc(cx + w/4, cy - h/4, 10, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - w/4, cy - h/4, 5, 0, Math.PI * 2);
                    ctx.arc(cx + w/4, cy - h/4, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // 체력바 표시
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(enemy.x, enemy.y - 15, enemy.width, 5);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(enemy.x, enemy.y - 15, enemy.width * (enemy.hp / enemy.maxHp), 5);
                } else {
                    // 일반 적 (줄에 따라 색상을 다르게 표현)
                    ctx.fillStyle = (enemy.type === 0) ? '#ff00ff' : (enemy.type === 1) ? '#ff0000' : '#00ff00';
                    
                    // 1. 몸통 (타원)
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, w / 4, h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 2. 왼쪽 날개
                    ctx.beginPath();
                    ctx.moveTo(cx - w / 4, cy);
                    ctx.lineTo(cx - w / 2, cy - h / 4);
                    ctx.lineTo(cx - w / 4, cy + h / 4);
                    ctx.fill();

                    // 3. 오른쪽 날개
                    ctx.beginPath();
                    ctx.moveTo(cx + w / 4, cy);
                    ctx.lineTo(cx + w / 2, cy - h / 4);
                    ctx.lineTo(cx + w / 4, cy + h / 4);
                    ctx.fill();

                    // 4. 더듬이
                    ctx.strokeStyle = ctx.fillStyle;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx - w / 8, cy - h / 2); // 왼쪽
                    ctx.lineTo(cx - w / 3, cy - h);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(cx + w / 8, cy - h / 2); // 오른쪽
                    ctx.lineTo(cx + w / 3, cy - h);
                    ctx.stroke();
                    
                    // 5. 눈 (흰색 둥근 점)
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - w/8, cy - h/4, 2, 0, Math.PI * 2);
                    ctx.arc(cx + w/8, cy - h/4, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // 미사일들을 그리는 함수
        function drawBullets() {
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        // 레이저 스킬 이펙트를 그리는 함수
        function drawLaser() {
            if (laserActive) {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.7)';
                const laserX = player.x + player.width / 2 - 10;
                // 플레이어 위치부터 화면 맨 위까지 레이저 박스 그리기
                ctx.fillRect(laserX, 0, 20, player.y);
            }
        }

        // 게임 상태 업데이트 (프레임마다 실행)
        function update() {
            if (isGameOver) return; // 게임 오버면 업데이트 중지
            
            const now = Date.now();
            
            // --------------------------
            // 1. 레이저 상태 및 UI 업데이트
            // --------------------------
            if (LASER_COOLDOWN > 0 && now < laserCooldownTimer) {
                // 쿨다운 중이면 남은 시간 초 표시
                const remaining = Math.ceil((laserCooldownTimer - now) / 1000);
                laserValEl.textContent = remaining + "초";
                laserValEl.style.color = "#ff3333";
            } else {
                // 쿨다운 완료 시 준비됨 표시 (무제한)
                laserValEl.textContent = LASER_COOLDOWN === 0 ? "무제한" : "준비됨";
                laserValEl.style.color = "#00ffcc";
            }

            // Z키를 누르면 레이저 발사
            if ((keys['KeyZ'] || keys['z']) && now >= laserCooldownTimer) {
                laserActive = true;
                laserTimer = now + LASER_DURATION;
                laserCooldownTimer = now + LASER_COOLDOWN;
                sfx.laser(); // 효과음 재생
            }
            
            // 레이저 활성화 중일 때 충돌 처리
            if (laserActive) {
                if (now > laserTimer) {
                    laserActive = false; // 시간이 지나면 레이저 꺼짐
                } else {
                    const laserX = player.x + player.width / 2;
                    const laserWidth = 20;
                    
                    // 레이저 범위 내의 적 파괴 (배열을 뒤에서부터 순회)
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let e = enemies[j];
                        // 적의 x 좌표 범위와 레이저의 폭을 비교
                        if (e.x < laserX + laserWidth/2 && e.x + e.width > laserX - laserWidth/2) {
                            if (e.type === 'boss') {
                                e.hp -= 2; // 레이저는 다단히트 데미지
                                if (e.hp <= 0) {
                                    enemies.splice(j, 1);
                                    score += 1000;
                                    scoreValEl.textContent = score;
                                    sfx.explosion();
                                }
                            } else {
                                enemies.splice(j, 1);
                                score += 50; // 파괴 시 점수 획득
                                scoreValEl.textContent = score;
                                sfx.explosion(); // 효과음 재생
                            }
                        }
                    }
                }
            }

            // --------------------------
            // 2. 플레이어 및 일반 공격 업데이트
            // --------------------------
            // 방향키로 플레이어 이동 (화면 밖으로 나가지 않게 방어)
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x + player.width < canvas.width) player.x += player.speed;

            // 스페이스바를 누르면 미사일 발사 (쿨다운 적용)
            if (keys['Space'] && now - lastShotTime > shotDelay) {
                bullets.push({
                    x: player.x + player.width / 2 - 2, // 우주선 중앙에서 발사
                    y: player.y,
                    width: 4,
                    height: 10,
                    color: '#ffcc00'
                });
                lastShotTime = Date.now();
                sfx.shoot(); // 발사음 재생
            }

            // 화면상의 모든 미사일을 위로 이동
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                // 화면 위로 넘어간 미사일 삭제
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // --------------------------
            // 3. 적 이동 로직
            // --------------------------
            let moveDown = false; // 아래로 이동해야 하는지 플래그
            let leftmost = canvas.width;
            let rightmost = 0;

            if (enemies.length > 0) {
                // 각 적의 x 좌표를 업데이트하고 전체 적 무리의 왼쪽/오른쪽 끝 위치 계산
                enemies.forEach(enemy => {
                    enemy.x += enemySpeed * enemyDirection;
                    if (enemy.x < leftmost) leftmost = enemy.x;
                    if (enemy.x + enemy.width > rightmost) rightmost = enemy.x + enemy.width;
                });

                // 벽에 닿았는지 체크 (방향 전환 및 아래로 이동)
                if (rightmost > canvas.width - 10 || leftmost < 10) {
                    enemyDirection *= -1; // 이동 방향 반대로 변경
                    moveDown = true;
                }

                // 아래로 이동
                if (moveDown) {
                    enemies.forEach(enemy => {
                        enemy.y += 20;
                        // 적이 플레이어의 y좌표까지 내려오면 게임 오버
                        if (enemy.y + enemy.height > player.y) {
                            endGame(false);
                        }
                    });
                }
            }

            // --------------------------
            // 4. 일반 미사일과 적의 충돌 감지
            // --------------------------
            // 미사일 배열과 적 배열을 모두 순회
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let b = bullets[i];
                    let e = enemies[j];
                    
                    // AABB(Axis-Aligned Bounding Box) 충돌 감지 공식
                    if (b && e && b.x < e.x + e.width &&
                        b.x + b.width > e.x &&
                        b.y < e.y + e.height &&
                        b.y + b.height > e.y) {
                        
                        bullets.splice(i, 1); // 미사일 적중 시 무조건 삭제
                        
                        if (e.type === 'boss') {
                            e.hp -= 10; // 미사일 한 발당 데미지 10
                            if (e.hp <= 0) {
                                enemies.splice(j, 1);
                                score += 1000; // 보스 처치 점수
                                scoreValEl.textContent = score;
                                sfx.explosion();
                            } else {
                                sfx.shoot(); // 피격 시 효과음(임시)
                            }
                        } else {
                            // 일반 적 충돌 시 즉시 삭제 및 점수 획득
                            enemies.splice(j, 1);
                            score += 100;
                            scoreValEl.textContent = score;
                            sfx.explosion(); // 폭발음 재생
                        }
                        break; // 미사일이 삭제되었으므로 다음 미사일로 넘어감
                    }
                }
            }

            // --------------------------
            // 5. 다음 레벨 조건 검사
            // --------------------------
            // 적이 더 이상 없으면 다음 레벨로 진행
            if (enemies.length === 0) {
                nextLevel();
            }
        }

        // 다음 레벨로 넘어가는 함수
        function nextLevel() {
            level++; // 레벨 1 증가
            levelValEl.textContent = level; // UI 업데이트
            enemySpeed += 0.5; // 적의 속도 증가시켜 난이도 상향
            bullets = []; // 떠있는 미사일 초기화
            createEnemies(); // 새로운 적군 생성
            sfx.levelUp(); // 레벨 업 사운드 재생
        }

        // 게임을 종료하는 함수 (win: 승리 여부)
        function endGame(win) {
            isGameOver = true;
            gameOverScreen.style.display = 'flex'; // 게임 오버 UI 표시
            finalScoreEl.textContent = score; // 최종 점수 표시
            
            if (win) { // 승리 시 (현재는 적을 잡으면 다음 레벨이므로 이 조건은 안 타지만 대비용)
                gameOverTitle.textContent = "승리하셨습니다!";
                gameOverTitle.style.color = "#00ffcc";
                sfx.levelUp();
            } else { // 패배 시 (적이 끝까지 내려옴)
                gameOverTitle.textContent = "게임 오버";
                gameOverTitle.style.color = "#ff3333";
                sfx.gameOver();
            }
        }

        // 게임 다시 시작 함수 (재시작 버튼에서 호출)
        function restartGame() {
            // 변수 초기화
            score = 0;
            level = 1;
            lives = 3;
            enemySpeed = 1;
            isGameOver = false;
            
            // 레이저 상태 초기화
            laserActive = false;
            laserCooldownTimer = 0;
            laserValEl.textContent = "준비됨";
            laserValEl.style.color = "#00ffcc";

            // 화면 UI 초기화
            scoreValEl.textContent = score;
            levelValEl.textContent = level;
            livesValEl.textContent = lives;
            gameOverScreen.style.display = 'none'; // 게임 오버 화면 숨기기
            
            // 플레이어 및 적 초기화
            player.x = canvas.width / 2 - 15;
            bullets = [];
            enemyDirection = 1;
            createEnemies();
            
            // 게임 루프 재시동
            gameLoop();
        }

        // 메인 게임 렌더링 루프 (매 프레임 호출됨)
        function gameLoop() {
            // 화면 싹 비우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 렌더링 파이프라인
            drawStars(); // 배경
            
            if (!isGameOver) { // 살아있을 때만 로직 처리
                update();      // 논리 업데이트(이동, 충돌)
                drawPlayer();  // 플레이어 그리기
                drawEnemies(); // 적 그리기
                drawBullets(); // 미사일 그리기
                drawLaser();   // 레이저 이펙트 그리기 (활성화 시)
                
                // 다음 프레임 요청 (보통 모니터 주사율에 맞춰 호출 됨)
                requestAnimationFrame(gameLoop);
            }
        }

        // 초기 적 생성 후 게임 최초 실행
        createEnemies();
        gameLoop();
    </script>
</body>
</html>
